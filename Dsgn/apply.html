:root{
  --silpo-orange:#FF8522;--silpo-orange-2:#F6935E;--silpo-orange-deep:#C96528;--silpo-orange-tag:#F0592C;
  --silpo-blue:#2458D3;--silpo-blue-2:#3E77FF;--silpo-blue-soft:#EEF2FC;
  --ink-100:#13131E;--ink-90:#202124;--ink-87:rgba(19,19,30,0.87);--ink-72:rgba(19,19,30,0.72);
  --ink-56:rgba(19,19,30,0.56);--ink-38:rgba(19,19,30,0.38);--ink-24:rgba(19,19,30,0.24);
  --ink-12:rgba(19,19,30,0.12);--ink-06:rgba(19,19,30,0.06);
  --surface-page:#F6F8FD;--surface-card:#FFFFFF;--surface-muted:#EDF0F6;
  --tag-pink:#FFDAEC;--tag-yellow-bg:#F6F7DF;--color-success:#2E6E75;--color-link:var(--silpo-blue);
  --shadow-tile:0 1px 0 0 rgba(0,0,0,0.06);--shadow-card:0 2px 8px 0 rgba(19,19,30,0.06);
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;--radius-2xl:24px;--radius-pill:999px;
  --font-sans:"Silpo Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-display:"Silpo Rounded","Silpo Text",-apple-system,sans-serif;
  --font-numeric:"Inter","Silpo Text",-apple-system,sans-serif;
}


*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--ink-90);-webkit-font-smoothing:antialiased}

/* HEADER */
.header{background:#fff;position:sticky;top:0;z-index:30;box-shadow:var(--shadow-tile)}
.header-row{display:flex;align-items:center;gap:14px;padding:14px 60px;max-width:1440px;margin:0 auto}
.h-burger{width:40px;height:40px;border-radius:10px;background:transparent;border:0;cursor:pointer;color:var(--ink-72);display:inline-flex;align-items:center;justify-content:center}
.h-burger:hover{background:var(--ink-06)}
.h-logo{height:40px;flex-shrink:0;display:flex;align-items:center;gap:8px;text-decoration:none}
.h-logo img{height:40px;width:40px;border-radius:10px}
.h-logo .wm{font-family:var(--font-display);font-weight:900;font-size:30px;color:var(--silpo-orange);letter-spacing:-0.5px;line-height:1}
.cat-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border:2px solid var(--silpo-orange);color:var(--silpo-orange);border-radius:var(--radius-pill);background:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;flex-shrink:0}
.cat-btn:hover{background:#FFF3E8}
.search-pill{flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 18px;background:var(--ink-06);border-radius:var(--radius-pill);min-width:280px}
.search-pill svg{width:20px;height:20px;color:var(--ink-56);flex-shrink:0}
.search-pill input{flex:1;border:0;background:transparent;outline:none;font-family:inherit;font-size:15px;color:var(--ink-90)}
.search-pill input::placeholder{color:var(--ink-56)}
.addr{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:10px;cursor:pointer;flex-shrink:0}
.addr:hover{background:var(--ink-06)}
.addr .pin{width:36px;height:36px;border-radius:999px;border:1.5px solid var(--ink-12);display:flex;align-items:center;justify-content:center;color:var(--silpo-orange)}
.addr .pin svg{width:18px;height:18px}
.addr .meta{display:flex;flex-direction:column;line-height:1.2}
.addr .meta b{font-weight:700;font-size:14px;color:var(--ink-100)}
.addr .meta span{font-size:12px;color:var(--ink-56);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-pill{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:var(--radius-pill);cursor:pointer;flex-shrink:0}
.user-pill:hover{background:var(--ink-06)}
.user-pill .av{width:36px;height:36px;border-radius:999px;background:var(--silpo-orange);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:0.02em}
.user-pill .meta{display:flex;flex-direction:column;line-height:1.2}
.user-pill .meta b{font-weight:700;font-size:14px;color:var(--ink-100)}
.user-pill .meta span{font-size:12px;color:var(--ink-56);font-family:var(--font-numeric)}
.user-pill .meta span b{font-family:var(--font-numeric);font-weight:700;color:var(--silpo-orange);font-size:12px}
.cart-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 22px;background:var(--silpo-blue);color:#fff;border:0;border-radius:var(--radius-pill);cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;flex-shrink:0;transition:background 150ms ease}
.cart-btn:hover{background:var(--silpo-blue-2)}
.cart-btn svg{width:20px;height:20px}
.sub-nav{background:#fff;border-top:1px solid var(--ink-06)}
.sub-nav-inner{max-width:1440px;margin:0 auto;padding:0 60px;display:flex;align-items:center;justify-content:center;gap:4px}
.sub-nav a{position:relative;display:inline-flex;align-items:center;padding:18px 18px;font-family:var(--font-sans);font-size:15px;font-weight:600;color:var(--ink-87);text-decoration:none;transition:color 120ms ease}
.sub-nav a:hover{color:var(--silpo-blue)}
.sub-nav a.active{color:var(--ink-100);font-weight:700}
.sub-nav a.active::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:3px;background:var(--silpo-orange);border-radius:2px 2px 0 0}

/* SHELL */
.shell{max-width:1320px;margin:0 auto;padding:0 60px;width:100%}

/* BUTTONS */
.btn-primary{height:56px;padding:0 36px;background:var(--silpo-blue);color:#fff;border:0;border-radius:var(--radius-lg);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:background 150ms ease;flex-shrink:0}
.btn-primary:hover{background:var(--silpo-blue-2)}
.btn-secondary{height:52px;padding:0 28px;background:var(--ink-100);color:#fff;border:0;border-radius:var(--radius-lg);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn-secondary:hover{opacity:0.88}

/* TAGS */
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--surface-muted);color:var(--ink-87);font-size:12px;font-weight:600}
.tag.hot{background:#FFE5D1;color:var(--silpo-orange-tag)}

/* JOB CARD */
.card{background:var(--surface-card);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-tile);display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:box-shadow 150ms ease,transform 150ms ease;min-height:260px;text-decoration:none;color:inherit}
.card:hover{box-shadow:var(--shadow-card);transform:translateY(-2px)}
.card .tags{display:flex;flex-wrap:wrap;gap:6px}
.card h3{margin:0;font-family:var(--font-sans);font-size:18px;font-weight:700;color:var(--ink-100);line-height:1.25}
.addr-line{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--ink-72);line-height:1.4}
.addr-line svg{color:var(--silpo-orange);flex-shrink:0;margin-top:1px}
.attrs{display:flex;flex-wrap:wrap;gap:6px}
.attr{padding:4px 10px;border-radius:var(--radius-pill);border:1px solid var(--ink-12);background:#fff;color:var(--ink-72);font-size:12px;font-weight:500}
.card .salary{margin-top:auto;font-family:var(--font-numeric);font-size:17px;font-weight:700;color:var(--ink-100)}

/* PAGER */
.pager{display:flex;align-items:center;justify-content:center;gap:6px;padding:24px 0}
.pager button{width:40px;height:40px;border-radius:10px;background:#fff;color:var(--ink-87);border:1.5px solid transparent;cursor:pointer;font-family:var(--font-numeric);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;transition:all 120ms ease}
.pager button:hover:not(.active):not(:disabled){background:var(--silpo-blue-soft);color:var(--silpo-blue)}
.pager button.active{background:var(--silpo-blue);color:#fff}
.pager button:disabled{opacity:.35;cursor:default}
.pager .dots{color:var(--ink-56);padding:0 4px}

/* PAGE HEAD */
.page-head{padding:32px 0 24px}
.page-head h1{margin:0;font-family:var(--font-display);font-size:40px;font-weight:800;color:var(--ink-100);letter-spacing:-0.02em;line-height:1}
.page-head .count{margin-top:12px;font-size:15px;color:var(--ink-72)}
.page-head .count b{color:var(--ink-100);font-weight:700;font-family:var(--font-numeric)}

/* SECTIONS */
.section-block{border-top:1px solid var(--ink-12);padding:48px 0 0}
.section-block h2{margin:0 0 20px;font-family:var(--font-display);font-size:28px;font-weight:800;color:var(--ink-100);letter-spacing:-0.01em}
.reasons{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.reason{background:var(--surface-card);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-tile);display:flex;gap:16px;align-items:flex-start}
.reason .icon{width:48px;height:48px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.reason .icon.r-pink{background:var(--tag-pink);color:#B5346F}
.reason .icon.r-green{background:#E1EFD9;color:#3E6B25}
.reason .icon.r-cream{background:#FFE5D1;color:var(--silpo-orange-deep)}
.reason .icon.r-yellow{background:var(--tag-yellow-bg);color:#8A7818}
.reason h4{margin:0 0 6px;font-family:var(--font-sans);font-size:16px;font-weight:700;color:var(--ink-100);line-height:1.25}
.reason p{margin:0;font-size:13px;color:var(--ink-72);line-height:1.4}

/* FAQ */
.faq{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.faq details{background:var(--surface-card);border-radius:var(--radius-lg);padding:0;box-shadow:var(--shadow-tile);overflow:hidden}
.faq summary{list-style:none;cursor:pointer;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-family:var(--font-sans);font-size:17px;font-weight:600;color:var(--ink-100)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .plus{width:28px;height:28px;border-radius:8px;background:var(--surface-muted);color:var(--ink-72);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 200ms ease}
.faq details[open] summary .plus{background:var(--silpo-blue);color:#fff}
.faq details[open] summary .plus .vertical{display:none}
.faq .ans{padding:0 28px 22px;font-size:15px;color:var(--ink-72);line-height:1.5;max-width:920px}

/* CTA */
.cta{margin-top:24px;background:var(--surface-card);border:1px solid var(--ink-12);border-radius:var(--radius-2xl);padding:28px 36px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.cta .copy h3{margin:0 0 6px;font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--ink-100);letter-spacing:-0.005em}
.cta .copy p{margin:0;font-size:14px;color:var(--ink-72)}
.cta .btn-primary{height:48px;padding:0 24px;font-size:15px}

/* FOOTER */
.foot{background:#F0F2F7;margin-top:64px;padding:48px 0 24px}
.foot .row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:48px}
.foot .brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.foot .brand .mark{width:36px;height:36px;border-radius:10px;background:var(--silpo-orange);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:18px}
.foot .brand b{font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--ink-100)}
.foot .blurb{font-size:13px;color:var(--ink-72);line-height:1.5;max-width:320px}
.foot h5{margin:0 0 14px;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-56);font-weight:700}
.foot a{display:block;padding:5px 0;color:var(--ink-87);text-decoration:none;font-size:14px}
.foot a:hover{color:var(--silpo-blue)}
.foot .legal{margin-top:36px;padding-top:20px;border-top:1px solid var(--ink-12);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-56)}
.foot .legal a{color:var(--ink-56);display:inline}

/* LAND SECTION */
.land-section{margin-top:56px}
.land-section>header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px}
.land-section>header h2{margin:0;font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-0.01em;color:var(--ink-100)}


.form-wrap{display:grid;grid-template-columns:1fr 360px;gap:32px;margin-top:32px}
.form-card{background:var(--surface-card);border-radius:var(--radius-2xl);padding:36px 40px;box-shadow:var(--shadow-tile)}
.form-card h2{margin:0 0 8px;font-family:var(--font-display);font-size:32px;font-weight:800;color:var(--ink-100)}
.form-card .sub{color:var(--ink-72);margin:0 0 28px;font-size:15px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.fld label{font-size:13px;font-weight:600;color:var(--ink-87)}
.fld label .req{color:var(--silpo-orange-tag);margin-left:2px}
.fld input[type=text],.fld input[type=tel],.fld input[type=email],.fld select{height:48px;padding:0 14px;border:1.5px solid var(--ink-12);border-radius:var(--radius-sm);background:#fff;color:var(--ink-100);font-family:inherit;font-size:15px;outline:none;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--silpo-blue)}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:var(--radius-pill);border:1.5px solid var(--ink-12);background:#fff;color:var(--ink-87);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all 120ms ease}
.opt:hover{border-color:var(--ink-24)}
.opt.active{background:var(--silpo-blue);border-color:var(--silpo-blue);color:#fff}
.upload{display:flex;align-items:center;gap:10px;padding:14px 18px;border:1.5px dashed var(--ink-24);border-radius:var(--radius-md);background:var(--ink-06);color:var(--ink-72);cursor:pointer;font-size:14px;font-weight:600;width:100%}
.upload:hover{border-color:var(--silpo-blue);color:var(--silpo-blue)}
.upload svg{color:var(--silpo-blue)}
.check-row{display:flex;align-items:flex-start;gap:10px;margin:22px 0 8px;font-size:13px;color:var(--ink-72);line-height:1.4;cursor:pointer}
.check-row .cb{margin-top:2px}
.check-row.active .cb{background:var(--silpo-blue);border-color:var(--silpo-blue)}
.check-row.active .cb svg{opacity:1}
.check-row a{color:var(--silpo-blue);text-decoration:underline}
.form-card .btn-primary{width:100%;margin-top:10px}
.form-foot{text-align:center;color:var(--ink-72);font-size:13px;margin-top:12px}
.form-aside{display:flex;flex-direction:column;gap:16px;position:relative}
.form-aside .tip{background:linear-gradient(150deg,#FFF3E5 0%,#FFE5D1 100%);border-radius:var(--radius-lg);padding:24px}
.form-aside .tip h4{margin:0 0 8px;font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--ink-100)}
.form-aside .tip p{margin:0 0 12px;font-size:14px;color:var(--ink-87);line-height:1.45}
.form-aside .tip ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.form-aside .tip ul li{display:flex;gap:8px;font-size:14px;color:var(--ink-87);align-items:flex-start}
.form-aside .tip ul li svg{color:var(--silpo-orange-deep);flex-shrink:0;margin-top:2px}
.success{background:var(--surface-card);border-radius:var(--radius-2xl);padding:64px 40px;box-shadow:var(--shadow-tile);text-align:center;max-width:640px;margin:32px auto 0}
.success .mark{width:88px;height:88px;border-radius:999px;margin:0 auto 24px;background:#DCEED1;color:#3E6B25;display:inline-flex;align-items:center;justify-content:center}
.success h2{margin:0 0 12px;font-family:var(--font-display);font-size:32px;font-weight:800;color:var(--ink-100)}
.success p{margin:0 0 28px;color:var(--ink-72);font-size:16px;line-height:1.5}
.success .ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.success .ctas .btn-secondary{background:#fff;color:var(--ink-100);border:1.5px solid var(--ink-12);height:52px;padding:0 28px;font-size:15px;border-radius:var(--radius-lg);font-family:inherit;font-weight:700;cursor:pointer}


@media(max-width:1180px){
  .shell{padding:0 24px}
  .header-row{padding:12px 24px}
  .sub-nav-inner{padding:0 24px}
  .main{grid-template-columns:240px 1fr}
  .grid{grid-template-columns:repeat(2,1fr)}
  .reasons{grid-template-columns:repeat(2,1fr)}
  .similar-grid{grid-template-columns:1fr}
  .vac-grid,.form-wrap{grid-template-columns:1fr}
  .vac-aside .apply{position:static}
}
@media(max-width:600px){
  .shell{padding:0 16px}
  .header-row{padding:10px 16px;gap:10px}
  .cat-btn{display:none}
  .addr{display:none}
  .user-pill{display:none}
  .search-pill{width:44px;height:44px;flex:0 0 44px;min-width:44px;border-radius:999px;padding:0;justify-content:center}
  .search-pill input{display:none}
  .cart-btn{padding:0 12px;min-width:44px;justify-content:center}
  .cart-label{display:none}
  .sub-nav-inner{padding:0 16px;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap;gap:0}
  .sub-nav-inner::-webkit-scrollbar{display:none}
  .sub-nav a{padding:14px 14px;font-size:14px;white-space:nowrap;flex-shrink:0}
  /* listing */
  .seg{grid-template-columns:1fr}
  .seg button{height:48px;font-size:15px}
  .search-row{flex-direction:column;gap:8px}
  .search-row .field{height:48px}
  .search-row .btn-primary{height:48px;width:100%}
  .main{grid-template-columns:1fr;gap:16px}
  .side{display:none}
  .grid{grid-template-columns:1fr}
  .sort-row{flex-direction:column;align-items:flex-start;gap:8px}
  .reasons{grid-template-columns:1fr 1fr}
  .faq summary{padding:16px 20px;font-size:15px}
  .faq .ans{padding:0 20px 16px;font-size:14px}
  .cta{flex-direction:column;align-items:flex-start;padding:20px;gap:16px}
  .cta .btn-primary{width:100%;display:flex;justify-content:center}
  .foot{margin-top:40px;padding:32px 0 20px}
  .foot .shell{padding:0 16px}
  .foot .row{grid-template-columns:1fr;gap:28px}
  .foot .legal{flex-direction:column;gap:8px;text-align:center}
  /* vacancy */
  .back-link{margin:16px 0 12px}
  .vac-head{grid-template-columns:1fr;padding:20px}
  .vac-head h1{font-size:24px}
  .vac-head .pricecol{align-items:flex-start}
  .vac-block{padding:20px}
  .similar-grid{grid-template-columns:1fr}
  /* apply */
  .form-card{padding:20px}
  .form-card h2{font-size:24px}
  .success{padding:40px 20px}
}

  </style>
</head>

function Pager({page,total,onChange}){
  let pages=[];
  if(total<=6){for(let i=1;i<=total;i++)pages.push(i);}
  else{
    if(page<=3)pages=[1,2,3,"…",total];
    else if(page>=total-2)pages=[1,"…",total-2,total-1,total];
    else pages=[1,"…",page-1,page,page+1,"…",total];
  }
  return(
    <nav className="pager" aria-label="Сторінки">
      <button disabled={page===1} onClick={()=>onChange(page-1)} aria-label="Назад"><Icon name="arrL" size={16}/></button>
      {pages.map((p,i)=>p==="…"?<span key={"e"+i} className="dots">…</span>:<button key={p} className={p===page?"active":""} onClick={()=>onChange(p)}>{p}</button>)}
      <button disabled={page===total} onClick={()=>onChange(page+1)} aria-label="Далі"><Icon name="arrR" size={16}/></button>
    </nav>
  );
}
